name: solera_huerta
description: "Larrea Huerta — vertical de la suite Larrea (Colección Nuevo Ser)."
publish_to: 'none'
version: 0.1.5+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: 12.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.3.3
  shared_preferences: ^2.3.2
  http: ^1.2.2
  share_plus: ^10.0.2
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  nuevo_ser_mapa:
    path: ../../packages/nuevo_ser_mapa
  nuevo_ser_avisos:
    path: ../../packages/nuevo_ser_avisos
  nuevo_ser_core:
    path: ../../packages/nuevo_ser_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icono-logo-huerta.png

  # Letra del tema común Larrea (temaSolera del core). SIL OFL.
  fonts:
    - family: Poppins
      fonts:
        - asset: packages/nuevo_ser_core/fuentes/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: packages/nuevo_ser_core/fuentes/Inter-Regular.ttf
          weight: 400
        - asset: packages/nuevo_ser_core/fuentes/Inter-Medium.ttf
          weight: 500
        - asset: packages/nuevo_ser_core/fuentes/Inter-SemiBold.ttf
          weight: 600
        - asset: packages/nuevo_ser_core/fuentes/Inter-Bold.ttf
          weight: 700

# Iconos del lanzador. El logo es PLACEHOLDER (ImageMagick, 2026-11-07):
# sustituir el PNG por el definitivo y regenerar con
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono-logo-huerta.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F5EFE2"
  adaptive_icon_foreground: "assets/icono-logo-huerta.png"
