    body {

  <script id="splash-screen-script">

<body style="background:#004331">

      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Avisos al momento (Web Push): window.larreaPush, ver avisos_push.js. -->
  <script src="avisos_push.js"></script>
  <script src="flutter_bootstrap.js" async=""></script>
  <script>
    // Abrirse sin cobertura: sw_zunbeltz.js guarda la app en el navegador.
    // Se le dice además lo que ya se ha cargado (la primera vez aún no
    // controlaba la página), y se pide que los datos no se borren solos.
    if ('serviceWorker' in navigator) {
      // Versión nueva: el service worker nuevo se instala en segundo plano y
      // toma el control. Si eso pasa nada más abrir, se recarga una vez para
      // enseñarla ya; más tarde no, que se perdería lo que se esté
      // escribiendo: se avisa y se recarga cuando ella diga.
      var habiaVersionGuardada = !!navigator.serviceWorker.controller;
      var momentoDeApertura = Date.now();
      var recargando = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!habiaVersionGuardada || recargando) return;
        if (Date.now() - momentoDeApertura > 20000) {
          avisarDeVersionNueva();
          return;
        }
        recargando = true;
        window.location.reload();
      });
      // Si la versión nueva acaba de bajarse con la app ya en uso, se avisa
      // con una franja abajo y se recarga cuando la persona quiera (va
      // encima del lienzo de Flutter). El idioma, el que tenga elegido en
      // la app (shared_preferences guarda en localStorage con «flutter.»).
      function avisarDeVersionNueva() {
        if (document.getElementById('aviso-version-nueva')) return;
        var idioma = '';
        try {
          idioma = JSON.parse(localStorage.getItem('flutter.zunbeltz.idioma_app') || '""');
        } catch (_) {}
        if (!idioma) idioma = (navigator.language || 'es').slice(0, 2);
        var enEuskera = idioma === 'eu';
        var franja = document.createElement('div');
        franja.id = 'aviso-version-nueva';
        franja.setAttribute('role', 'status');
        franja.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:2147483647;' +
          'max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center;' +
          'padding:12px 12px 12px 16px;border-radius:16px;background:#004331;color:#fff;' +
          'font:500 15px/1.35 Inter,system-ui,sans-serif;box-shadow:0 4px 16px rgba(10,26,20,.3)';
        var texto = document.createElement('span');
        texto.style.flex = '1';
        texto.textContent = enEuskera
          ? 'Aplikazioaren bertsio berria prest dago.'
          : 'Hay una versión nueva de la app.';
        var boton = document.createElement('button');
        boton.type = 'button';
        boton.textContent = enEuskera ? 'Berriz kargatu' : 'Recargar';
        boton.style.cssText = 'border:0;border-radius:999px;padding:10px 18px;background:#25AC74;' +
          'color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer';
        boton.addEventListener('click', function () {
          recargando = true;
          window.location.reload();
        });
        franja.appendChild(texto);
        franja.appendChild(boton);
        document.body.appendChild(franja);
      }
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw_zunbeltz.js').catch(function (error) {
          console.warn('Sin service worker:', error);
        });
        navigator.serviceWorker.ready.then(function (registro) {
          var avisarDeLoCargado = function () {
            var urls = performance.getEntriesByType('resource').map(function (entrada) {
              return entrada.name;
            });
            if (registro.active) registro.active.postMessage({ tipo: 'guardar', urls: urls });
          };
          avisarDeLoCargado();
          setTimeout(avisarDeLoCargado, 15000);
        });
      });
    }
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
  </script>


</body></html>
