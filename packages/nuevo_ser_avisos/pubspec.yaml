name: nuevo_ser_avisos
description: "Avisos de la suite Larrea: notificaciones locales programadas (recordatorios con hora). Separado del core para que los juegos Kids no carguen con flutter_local_notifications."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Las mismas versiones que ya usa Larrea Zunbeltz.
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
