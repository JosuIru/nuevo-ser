name: fichas_imprimibles
description: >-
  Fichas imprimibles de Colección Nuevo Ser Kids. Genera PDF A4 de
  actividades para el aula sin pantallas a partir de las habilidades de
  Uno Roto (apps/uno-roto/assets/data/skills.json). Dart puro.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.5.0
  pdf: ^3.11.1
  # No se usa directamente. pdf limita archive a <4.1 e image 4.11+
  # llama a ZLibDecoder.decodeLazy, que no existe en esas versiones: sin
  # este tope los tests no compilan.
  image: ">=4.3.0 <4.11.0"

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
